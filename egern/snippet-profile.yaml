# ============================================================
#  iOS 瘦身 · 主配置片段
#  ----------------------------------------------------------
#  不想托管模块文件？把下面的 rules 直接粘进 Egern 主配置
#  （Profile.yaml）的 rules 列表里即可，效果完全一样。
#
#  ⚠️ 位置很重要：客户端从上到下匹配第一条命中的规则。
#     请把这段放在任何宽泛的直连规则之前，否则完全失效。
#
#  验证：请求记录 → 打开任意 App → 看是否显示 REJECT。
# ============================================================

rules:

  # ── 广告 SDK：字节穿山甲 / Pangle ──
  - domain_suffix:
      match: "pangle.cn"
      policy: REJECT
  - domain_suffix:
      match: "pangle.io"
      policy: REJECT
  - domain_keyword:
      match: "pangolin"
      policy: REJECT
  - domain_keyword:
      match: "pglstatp-toutiao"
      policy: REJECT

  # ── 广告 SDK：腾讯优量汇 / 广点通 ──
  - domain_suffix:
      match: "pgdt.gtimg.cn"
      policy: REJECT
  - domain_suffix:
      match: "gdt.qq.com"
      policy: REJECT
  - domain_suffix:
      match: "l.qq.com"
      policy: REJECT
  - domain:
      match: "sdk.e.qq.com"
      policy: REJECT

  # ── 广告 SDK：百度联盟 ──
  - domain_suffix:
      match: "mobads.baidu.com"
      policy: REJECT

  # ── 广告 SDK：阿里妈妈 / 淘宝联盟 ──
  - domain_keyword:
      match: "afpapi.alimama.com"
      policy: REJECT
  - domain_keyword:
      match: "wgo.mmstat.com"
      policy: REJECT

  # ── 广告 SDK：国外 ──
  - domain_keyword:
      match: "applovin"
      policy: REJECT
  - domain_keyword:
      match: "adsystem"
      policy: REJECT
  - domain_keyword:
      match: "doubleclick."
      policy: REJECT

  # ── 统计 / 归因 / 崩溃上报 ──
  - domain_keyword:
      match: "umeng"
      policy: REJECT
  - domain_keyword:
      match: "appsflyer"
      policy: REJECT
  - domain_keyword:
      match: "adjust."
      policy: REJECT
  - domain_keyword:
      match: "crashlytics"
      policy: REJECT
  - domain_suffix:
      match: "bugly.qq.com"
      policy: REJECT


# ============================================================
#  进阶：外挂社区规则集（想要更彻底的全网追踪拦截时用）
#  ----------------------------------------------------------
#  手抄几千条域名不现实。Egern 支持直接引用远程规则集，
#  由它自己下载和维护。下面这几套都是长期维护的：
